name: Build Fabric 1.20.1 Bridge (experimental)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-pack inspection utilities
        run: python -m unittest discover -s tests -v
      - name: Compile Fabric mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: actions-stuff-bridge-fabric-1.20.1-unverified
          path: build/libs/*.jar
          retention-days: 7
