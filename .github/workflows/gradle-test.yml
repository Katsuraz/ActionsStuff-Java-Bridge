name: Fabric 1.21.11 experimental bridge
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Validate source-pack inspection utilities
        run: python -m unittest discover -s tests -v
      - name: Compile Fabric 1.21.11 mod
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: actions-stuff-bridge-fabric-1.21.11-alpha
          path: build/libs/*.jar
          retention-days: 14
