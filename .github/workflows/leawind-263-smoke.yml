name: Leawind 26.3 experimental headless client smoke

on:
  push:
    paths:
      - '.github/workflows/leawind-263-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download previously compiled real 26.3 API
        uses: actions/download-artifact@v4
        with:
          name: perspective-api-26.3-port-attempt
          repository: Katsuraz/ActionsStuff-Java-Bridge
          run-id: 43191884326
          github-token: ${{ github.token }}
          path: api-output
      - name: Prepare Third Person 26.3 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Leawind/Third-Person.git third-person
          git -C third-person checkout --detach 7c9ba2a54d41acd3e32eec773b928b1fe76e5ec4
          api=$(find api-output -type f -name '*+fabric-26.3.jar' ! -name '*sources*' | head -n 1)
          test -n "$api"
          python tools/port_leawind_263.py third-person "$api"
      - name: Install headless display tooling
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
      - name: Launch Minecraft 26.3 Fabric development client (headless attempt)
        shell: bash
        run: |
          mkdir -p diagnostics
          export SDL_VIDEODRIVER=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cd third-person
          chmod +x gradlew
          set +e
          timeout --signal=INT --kill-after=10s 120s xvfb-run -a \
            ./gradlew :26.3-fabric:runClient --no-daemon \
            > ../diagnostics/client-launch.log 2>&1
          code=$?
          echo "$code" > ../diagnostics/client-exit-code.txt
          echo "Minecraft headless attempt exit code $code"
          tail -80 ../diagnostics/client-launch.log
          # Nonzero here can be an X server / GPU limitation rather than a mod defect.
          exit 0
      - name: Report potential Mixin failures
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          if [[ -f diagnostics/client-launch.log ]]; then
            grep -Ein 'MixinApplyError|MixinTransformerError|InvalidInjectionException|ClassNotFoundException|NoSuchMethodError|NoClassDefFoundError|FATAL|crash report' diagnostics/client-launch.log > diagnostics/suspected-errors.txt || true
          fi
      - name: Upload runtime diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leawind-263-headless-runtime-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
