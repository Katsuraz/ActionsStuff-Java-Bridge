name: Port Leawind camera mods to Minecraft 26.3 (Fabric)

on:
  push:
    paths:
      - '.github/workflows/port-leawind-263.yml'
      - 'tools/port_leawind_263.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perspective-api-263:
    name: Build Perspective API 26.3 from upstream source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out port instructions
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch verified Perspective API upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Leawind/Perspective-API.git perspective-api
          git -C perspective-api checkout --detach 533815d998aa09e1641ced78f517eeadd7e629f7
          sed -i 's/^mod.version=.*/mod.version=1.5.0-beta/' perspective-api/gradle.properties
          grep -n '26.3-fabric' perspective-api/stonecutter.gradle.kts
      - name: Build Perspective API for Minecraft 26.3 Fabric
        shell: bash
        run: |
          set -o pipefail
          cd perspective-api
          chmod +x gradlew
          ./gradlew :26.3-fabric:build --no-daemon --stacktrace 2>&1 | tee ../perspective-build.log
      - name: Report Perspective API JARs
        if: always()
        run: find perspective-api/versions/26.3-fabric/build/libs -maxdepth 1 -type f -name '*.jar' -print || true
      - name: Upload build diagnostics and distributable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perspective-api-26.3-port-attempt
          path: |
            perspective-build.log
            perspective-api/versions/26.3-fabric/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7
